# Gehoert in den Fork paulk764/OpenMAIC als .github/workflows/build-image.yml
# Baut das Docker-Image einer gewaehlten Version und legt es in ghcr.io ab.
# Start nur von Hand, Beispiele:
#   gh workflow run build-image -R paulk764/OpenMAIC -f ref=v1.4.2
#   gh workflow run build-image -R paulk764/OpenMAIC -f ref=v1.4.2 -f suffix=-pro \
#     -f flags="NEXT_PUBLIC_MAIC_EDITOR_ENABLED=true NEXT_PUBLIC_ENABLE_PPTX_IMPORT=true"
# NEXT_PUBLIC_* sind Bau-Schalter: sie werden ins Image geschrieben, Aendern heisst neu bauen.
# Actions per Commit-SHA wie im HomeLab-Dashboard (ci.yml, Job build-image).
name: build-image
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag oder Branch von OpenMAIC, z. B. v1.4.2'
        required: true
        default: 'v1.4.2'
      suffix:
        description: 'Anhang an den Image-Tag, z. B. -pro (leer = kein Anhang)'
        required: false
        default: ''
      flags:
        description: 'Bau-Schalter, durch Leerzeichen getrennt: NAME=wert NAME2=wert'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quelle ist immer das Original, damit Tags nicht erst in den Fork muessen.
          repository: THU-MAIC/OpenMAIC
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Eigene Korrekturen: patches/<ref>/*.patch aus diesem Fork. Ohne Ordner bleibt das Original.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .fork
          persist-credentials: false
      - name: Eigene Korrekturen anwenden
        env:
          REF: ${{ inputs.ref }}
        run: |
          shopt -s nullglob
          for p in .fork/patches/"$REF"/*.patch; do
            echo "Korrektur: $p"
            git apply --check "$p"
            git apply "$p"
          done
          rm -rf .fork
          git status --short
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen und hochladen
        env:
          REF: ${{ inputs.ref }}
          SUFFIX: ${{ inputs.suffix }}
          FLAGS: ${{ inputs.flags }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openmaic:${REF}${SUFFIX}"
          ARGS=()
          for f in $FLAGS; do
            case "$f" in
              [A-Z_]*=*) ARGS+=(--build-arg "$f") ;;
              *) echo "Ungueltiger Schalter: $f"; exit 1 ;;
            esac
          done
          echo "Baue $IMAGE mit: ${ARGS[*]}"
          if [ -f tests/classroom/complete-summary.test.ts ]; then
            docker build "${ARGS[@]}" --target builder -t openmaic-pruefung .
            # Seit 25.11.2026 auch die Slot- und Chat-Tests (Patch 02 classroom.chat)
            TESTS=""
            for d in tests/classroom tests/config tests/server/model-config tests/lib/chat/pi tests/model-settings; do
              [ -e "$d" ] && TESTS="$TESTS $d"
            done
            docker run --rm openmaic-pruefung pnpm exec vitest run $TESTS
          fi
          docker build "${ARGS[@]}" -t "$IMAGE" .
          docker push "$IMAGE"
